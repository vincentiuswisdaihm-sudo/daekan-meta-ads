<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ikon daekan-meta-ads: corong 5 lapis (5 fase pipeline) + panah pertumbuhan. Desain generik, tanpa logo pihak ketiga. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g transform="translate(-14 0)">
  <!-- Corong: 5 lapis = riset, strategi, landing page, produksi, launch -->
  <g fill="#F8FAFC">
    <rect x="192" y="268" width="560" height="72" rx="36" opacity="0.95"/>
    <rect x="242" y="372" width="460" height="72" rx="36" opacity="0.85"/>
    <rect x="292" y="476" width="360" height="72" rx="36" opacity="0.75"/>
    <rect x="342" y="580" width="260" height="72" rx="36" opacity="0.65"/>
  </g>
  <rect x="392" y="684" width="160" height="72" rx="36" fill="url(#accent)"/>
  <!-- Panah pertumbuhan -->
  <g fill="none" stroke="url(#accent)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 720 L824 496"/>
    <path d="M688 488 L832 488 L832 632"/>
  </g>
  </g>
</svg>
